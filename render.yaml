services:
  # Service Frontend
  - type: web
    name: eglise-etdv-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_VERSION
        value: 22.22.0

  # Service Backend (optionnel)
  - type: web
    name: eglise-etdv-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0